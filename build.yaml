# This file generates the GitHub Actions matrix (only THIS root-level build.yaml is read by CI).
# Board names follow ZMK main / Zephyr 4.1: nice_nano_v2 is now "nice_nano//zmk".
# artifact-name is set explicitly because the default name is built from the board name,
# and "nice_nano//zmk" contains slashes, which breaks the "Rename artifacts" step.
---
include:
  - board: nice_nano//zmk
    shield: cck_ball_left
    artifact-name: cck_ball_left
  - board: nice_nano//zmk
    shield: cck_ball_right
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: cck_ball_right
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset
