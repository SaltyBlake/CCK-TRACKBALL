CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

# badjeff PMW3610 driver (ZMK main / "-alt" version). CPI, axis swap/invert and
# input codes are set in cck_ball_right.overlay, not here.
CONFIG_PMW3610_ALT=y

# The sensor is powered through the ext-power rail: give it time to come up
# (avoids "Incorrect product id 0xFF" on nice!nano, per the driver README).
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000

# Replaces the old POLLING_RATE_125_SW option (about 125 Hz reports).
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=8
