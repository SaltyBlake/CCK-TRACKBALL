CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Enable 32kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

# Enable rotary encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# MOUSE / TRACKBALL
CONFIG_ZMK_POINTING=y

# Keep smooth (hi-res) scrolling OFF: every scroll step is then a full mouse-wheel notch,
# which is what CAD programs like AutoCAD expect for zooming.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n

# Deep sleep: after 15 minutes without activity the halves power down to save battery.
# Press a key to wake them (moving the trackball may not wake a sleeping half).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
